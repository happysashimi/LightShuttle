<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Shuttle</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #root {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
        }
        #game-canvas {
            background: #000;
            display: block;
        }
        #start-menu, #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        #game-over {
            display: none;
        }
        h1 {
            font-size: 4em;
            margin: 0 0 20px 0;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000;
        }
        button {
            margin: 10px;
            padding: 15px 30px;
            font-size: 1.2em;
            background: #4a4a4a;
            color: white;
            border: 2px solid #666;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #666;
            transform: scale(1.05);
        }
        .controls {
            margin-top: 30px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 80%;
        }
        .controls h3 {
            margin-top: 0;
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="start-menu">
            <h1>Light Shuttle</h1>
            <button id="start-button">START GAME</button>
            <div class="controls">
                <h3>CONTROLS</h3>
                <h5>WASD or Arrow Keys - Move</h5>
                <h6>SPACE - Dash</h6>
            </div>
        </div>
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p id="score-display">Survived: 0 seconds</p>
            <button id="restart-button">CONTINUE</button>
        </div>
        <canvas id="game-canvas"></canvas>
    </div>
    <script src="game.js"></script>
</body>
</html>
