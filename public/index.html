<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Shuttle</title>
    <style>
        /* The game draws its own UI on the canvas; React mounts into #root,
           which is a flex box that centres the game. */
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #root { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
